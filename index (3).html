<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-root: #090b10; --bg-sidebar: #0f1219; --bg-panel: #141822; --bg-block: #1c2230;
            --bg-block-hover: #262e40; --bg-block-active: #1e293b; --accent: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
            --fav-color: #ff2a5f; --text-main: #f1f5f9; --text-muted: #64748b; --border: rgba(255,255,255,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-root); color: var(--text-main); height: 100vh; width: 100vw; overflow: hidden; display: flex; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .portrait-warning { display: none; position: fixed; inset: 0; background: var(--bg-root); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .portrait-warning i { font-size: 50px; color: var(--accent); margin-bottom: 15px; }
        @media screen and (orientation: portrait) { .portrait-warning { display: flex; } .app-shell { display: none !important; } }

        .app-shell { display: flex; width: 100%; height: 100%; }

        .icon-rail { width: 46px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 20px; z-index: 30; flex-shrink: 0; }
        .app-logo { font-weight: 900; font-size: 15px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .rail-btn { color: var(--text-muted); font-size: 16px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; }
        .rail-btn:hover, .rail-btn.active { color: var(--text-main); background: rgba(0,210,255,0.15); box-shadow: inset 0 0 0 1px rgba(0,210,255,0.3); }

        .groups-panel { width: 175px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: margin-left 0.25s ease; z-index: 20; }
        .groups-panel.collapsed { margin-left: -175px; }
        .search-bar { padding: 8px; border-bottom: 1px solid var(--border); }
        .search-bar input { width: 100%; background: var(--bg-root); border: 1px solid var(--border); color: var(--text-main); padding: 6px 10px; border-radius: 6px; font-size: 12px; outline: none; }
        .search-bar input:focus, .search-bar input.tv-focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,210,255,0.35); }
        .groups-list { flex-grow: 1; overflow-y: auto; padding: 6px; }
        .group-item { padding: 9px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .group-item:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
        .group-item.active { color: #fff; font-weight: 700; background: var(--accent-gradient); box-shadow: 0 4px 12px rgba(0,114,255,0.3); }
        .group-item.tv-focus { outline: 2px solid #fff; outline-offset: 1px; color: #fff; background: rgba(255,255,255,0.1); }
        .group-item.active.tv-focus { background: var(--accent-gradient); }

        .main-workspace { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-root); min-width: 0; }

        .top-deck { height: 44%; min-height: 135px; display: flex; border-bottom: 1px solid var(--border); background: radial-gradient(circle at 20% 50%, #151c2c 0%, #090b10 100%); padding: 10px 14px; gap: 15px; align-items: center; }
        .mini-player-box { height: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .mini-player-box.full { position: fixed; inset: 0; width: 100vw; height: 100vh; aspect-ratio: auto; z-index: 1000; border-radius: 0; border: 0; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .player-controls-overlay { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; z-index: 10; }
        .mini-player-box.full .player-controls-overlay { display: none; }
        .ctrl-btn { background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }

        #osd { display: none; position: absolute; left: 24px; bottom: 24px; background: rgba(9,11,16,0.85); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 16px; z-index: 20; max-width: 70%; }
        .mini-player-box.full #osd.show { display: block; }
        #osd .o-ch { font-size: 18px; font-weight: 800; }
        #osd .o-prog { font-size: 13px; color: #94a3b8; margin-top: 2px; }

        .program-details { flex-grow: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding-right: 5px; min-width: 0; }
        .prog-header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .live-pill { background: var(--accent-gradient); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .prog-channel-label { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prog-main-title { font-size: 17px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .prog-time-row { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
        .prog-bar-wrap { width: 120px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .prog-bar-fill { height: 100%; background: var(--accent); width: 0%; }
        .prog-desc-box { font-size: 11px; color: #94a3b8; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .prog-next-box { margin-top: auto; padding-top: 4px; font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prog-next-box span { color: #cbd5e1; font-weight: 600; }

        .epg-bottom-area { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .timeline-header { height: 28px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; flex-shrink: 0; }
        .date-corner { width: 190px; flex-shrink: 0; padding: 0 12px; font-size: 11px; font-weight: 700; color: var(--accent); border-right: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .time-slots-header { flex-grow: 1; display: flex; overflow: hidden; }
        .time-col-hdr { flex: 1; padding-left: 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); border-left: 1px solid var(--border); }

        .epg-rows-container { flex-grow: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
        .epg-row { height: 44px; display: flex; border-bottom: 1px solid var(--border); }
        .epg-row.active-row { background: rgba(0,210,255,0.06); }
        .ch-cell { width: 190px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px; gap: 8px; border-right: 1px solid var(--border); cursor: pointer; background: var(--bg-panel); }
        .epg-row.active-row .ch-cell { background: #192336; border-left: 3px solid var(--accent); }
        .epg-row.tv-focus .ch-cell { background: #22344f; outline: 2px solid #fff; outline-offset: -2px; }
        .epg-row.tv-focus .ch-title { color: #fff; }
        .ch-num { font-size: 11px; font-weight: 700; color: var(--text-muted); width: 22px; text-align: right; flex-shrink: 0; }
        .ch-logo { width: 28px; height: 28px; object-fit: contain; background: rgba(255,255,255,0.06); border-radius: 5px; padding: 2px; flex-shrink: 0; }
        .ch-title { font-size: 12px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }
        .ch-fav { font-size: 12px; color: rgba(255,255,255,0.15); padding: 4px; }
        .ch-fav.is-fav { color: var(--fav-color); }

        .ch-timeline { flex-grow: 1; display: flex; position: relative; overflow: hidden; background: rgba(255,255,255,0.01); }
        .epg-prog-block { height: 100%; border-right: 1px solid var(--bg-root); background: var(--bg-block); padding: 4px 8px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; overflow: hidden; }
        .epg-prog-block.current-live { background: var(--bg-block-active); border-bottom: 2px solid var(--accent); }
        .epg-prog-title { font-size: 11px; font-weight: 600; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .epg-prog-sub { font-size: 9px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .epg-empty-block { width: 100%; height: 100%; display: flex; align-items: center; padding-left: 12px; font-size: 11px; color: rgba(255,255,255,0.2); font-style: italic; }

        #hint { position: fixed; right: 10px; bottom: 6px; font-size: 9px; color: rgba(255,255,255,0.25); z-index: 5; pointer-events: none; }

        .loader-screen { position: fixed; inset: 0; background: var(--bg-root); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(0,210,255,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="portrait-warning">
        <i class="fa-solid fa-rotate"></i>
        <h3>Modo Horizontal Requerido</h3>
    </div>

    <div class="loader-screen" id="loader">
        <div class="spinner"></div>
        <div style="font-size: 14px; font-weight: 600;">Cargando NexusTV...</div>
    </div>

    <div class="app-shell" id="app-shell">
        <nav class="icon-rail">
            <div class="app-logo">NX</div>
            <div class="rail-btn active" id="btn-toggle-groups" onclick="toggleGroupsPanel()"><i class="fa-solid fa-layer-group"></i></div>
            <div class="rail-btn" onclick="showFavorites()"><i class="fa-solid fa-heart"></i></div>
            <div class="rail-btn" onclick="showAllFirstCat()"><i class="fa-solid fa-tv"></i></div>
        </nav>

        <aside class="groups-panel" id="groups-panel">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Buscar canal..." oninput="filterChannels()">
            </div>
            <div class="groups-list" id="groups-list"></div>
        </aside>

        <main class="main-workspace">
            <section class="top-deck">
                <div class="mini-player-box" id="player-box">
                    <video id="video-player" playsinline autoplay></video>
                    <div id="osd"><div class="o-ch" id="osd-ch"></div><div class="o-prog" id="osd-prog"></div></div>
                    <div class="player-controls-overlay">
                        <div class="ctrl-btn" onclick="setVideoFull(true)"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></div>
                    </div>
                </div>

                <div class="program-details">
                    <div class="prog-header-row">
                        <span class="live-pill">EN VIVO</span>
                        <span class="prog-channel-label" id="info-ch-name">Selecciona un canal</span>
                    </div>
                    <div class="prog-main-title" id="info-prog-title">Guía Interactiva NexusTV</div>
                    <div class="prog-time-row">
                        <span id="info-prog-time">--:-- - --:--</span>
                        <div class="prog-bar-wrap" id="info-bar-wrap" style="display:none;"><div class="prog-bar-fill" id="info-bar-fill"></div></div>
                        <span id="info-prog-rem" style="color: var(--accent);"></span>
                    </div>
                    <div class="prog-desc-box" id="info-prog-desc">OK = reproducir / pantalla completa · OK mantenido o Menú = favorito · ◀ grupos · ▶ canales.</div>
                    <div class="prog-next-box" id="info-prog-next"></div>
                </div>
            </section>

            <section class="epg-bottom-area">
                <div class="timeline-header">
                    <div class="date-corner"><span id="current-date-label">Hoy</span><i class="fa-regular fa-clock"></i></div>
                    <div class="time-slots-header" id="time-slots-header"></div>
                </div>
                <div class="epg-rows-container" id="epg-rows"></div>
            </section>
        </main>
    </div>

<script>
const HOST = "http://tv-70952.123gate.org:8080";
const USER = "TV-2685917907712";
const PASS = "361555909697";

let hls = null;
let allCategories = [];
let currentStreams = [];
let favorites = JSON.parse(localStorage.getItem('nx_favs')) || [];
let epgCache = {};
let epgObserver = null;
let windowStartMs = 0;
let windowEndMs = 0;

// --- Estado del mando (D-pad) ---
let zone = 'channels';      // 'search' | 'groups' | 'channels'
let rowIdx = 0;
let groupIdx = 0;
let playingId = null;
let videoFull = false;
let osdTimer = null;

async function api(action, params = "") {
    const res = await fetch(`${HOST}/player_api.php?username=${USER}&password=${PASS}&action=${action}${params}`);
    return await res.json();
}

function b64Decode(str) {
    if (!str) return "";
    try { return decodeURIComponent(escape(window.atob(str))); } catch (e) { return str; }
}

function parseEpgTime(item, isStart) {
    const ts = isStart ? item.start_timestamp : item.stop_timestamp;
    if (ts) return parseInt(ts) * 1000;
    const raw = isStart ? item.start : item.end;
    if (!raw) return 0;
    return new Date(raw.replace(' ', 'T')).getTime();
}

function setupTimelineHeader() {
    const now = new Date();
    const days = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    document.getElementById('current-date-label').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
    const startSlot = new Date(now);
    startSlot.setMinutes(now.getMinutes() >= 30 ? 30 : 0, 0, 0);
    windowStartMs = startSlot.getTime();
    windowEndMs = windowStartMs + (2 * 60 * 60 * 1000);
    const header = document.getElementById('time-slots-header');
    header.innerHTML = '';
    for (let i = 0; i < 4; i++) {
        const slotDate = new Date(windowStartMs + (i * 30 * 60 * 1000));
        header.innerHTML += `<div class="time-col-hdr">${slotDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;
    }
}

async function init() {
    setupTimelineHeader();
    setupEpgLazyLoader();
    try {
        allCategories = await api("get_live_categories");
        const gList = document.getElementById('groups-list');
        gList.innerHTML = '';

        const favDiv = document.createElement('div');
        favDiv.className = 'group-item';
        favDiv.id = 'group-fav-item';
        favDiv.innerHTML = `<i class="fa-solid fa-heart" style="color:var(--fav-color); margin-right:6px;"></i> Favoritos (${favorites.length})`;
        favDiv.onclick = () => showFavorites();
        gList.appendChild(favDiv);

        allCategories.forEach((cat, idx) => {
            const div = document.createElement('div');
            div.className = 'group-item';
            div.innerText = cat.category_name;
            div.onclick = () => {
                document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                groupIdx = groupEls().indexOf(div);
                loadCategoryChannels(cat.category_id);
            };
            gList.appendChild(div);
            if (idx === 0) { div.click(); }
        });

        document.getElementById('loader').style.display = 'none';
        zone = 'groups';
        groupIdx = 1;
        paintFocus();
    } catch (err) {
        document.getElementById('loader').innerHTML = `<div style="color:#ff2a5f; font-weight:bold;">Error conectando al servidor</div><div style="font-size:12px; color:#94a3b8;">Comprueba la conexión a internet.</div>`;
    }
}

async function loadCategoryChannels(catId) {
    const container = document.getElementById('epg-rows');
    container.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:12px;"><i class="fa-solid fa-circle-notch fa-spin"></i> Cargando parrilla...</div>`;
    try {
        currentStreams = await api("get_live_streams", `&category_id=${catId}`);
        document.getElementById('search-input').value = '';
        renderEpgGrid(currentStreams);
    } catch (e) {
        container.innerHTML = `<div style="padding:20px; color:red;">Error cargando canales</div>`;
    }
}

function renderEpgGrid(streams) {
    const container = document.getElementById('epg-rows');
    container.innerHTML = '';
    if (!streams || streams.length === 0) {
        container.innerHTML = `<div style="padding:25px; text-align:center; color:var(--text-muted); font-size:12px;">No hay canales en esta lista.</div>`;
        rowIdx = 0;
        return;
    }
    const fallbackImg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><rect width="30" height="30" fill="%231e293b"/><text x="50%" y="50%" font-size="9" fill="%23fff" text-anchor="middle" dominant-baseline="middle">TV</text></svg>`;

    streams.forEach((s, idx) => {
        const isFav = favorites.some(f => f.stream_id === s.stream_id);
        const row = document.createElement('div');
        row.className = 'epg-row' + (s.stream_id == playingId ? ' active-row' : '');
        row.dataset.streamId = s.stream_id;
        row.innerHTML = `
            <div class="ch-cell" onclick="clickChannel(${idx})">
                <span class="ch-num">${idx + 1}</span>
                <img class="ch-logo" src="${s.stream_icon || ''}" onerror="this.src='${fallbackImg}'">
                <span class="ch-title">${s.name}</span>
                <i class="fa-solid fa-heart ch-fav ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite(${s.stream_id}, event)"></i>
            </div>
            <div class="ch-timeline" id="tl-${s.stream_id}" onclick="clickChannel(${idx})">
                <div class="epg-empty-block">Cargando guía...</div>
            </div>`;
        container.appendChild(row);
        if (epgObserver) epgObserver.observe(row);
    });

    const pi = streams.findIndex(s => s.stream_id == playingId);
    rowIdx = pi >= 0 ? pi : 0;
    paintFocus();
}

function setupEpgLazyLoader() {
    epgObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                fetchChannelEpg(entry.target.dataset.streamId);
                epgObserver.unobserve(entry.target);
            }
        });
    }, { root: document.getElementById('epg-rows'), rootMargin: "80px" });
}

async function fetchChannelEpg(streamId) {
    const tlBox = document.getElementById(`tl-${streamId}`);
    if (!tlBox) return;
    if (epgCache[streamId]) { drawTimelineBlocks(streamId, epgCache[streamId]); return; }
    try {
        const data = await api("get_short_epg", `&stream_id=${streamId}&limit=6`);
        const listings = (data && data.epg_listings) ? data.epg_listings : [];
        epgCache[streamId] = listings;
        drawTimelineBlocks(streamId, listings);
    } catch (e) {
        tlBox.innerHTML = `<div class="epg-empty-block">Sin información</div>`;
    }
}

function drawTimelineBlocks(streamId, listings) {
    const tlBox = document.getElementById(`tl-${streamId}`);
    if (!tlBox) return;
    if (!listings || listings.length === 0) { tlBox.innerHTML = `<div class="epg-empty-block">Sin información</div>`; return; }
    const totalWindow = windowEndMs - windowStartMs;
    const nowMs = Date.now();
    let html = '';
    listings.forEach(item => {
        const sMs = parseEpgTime(item, true);
        const eMs = parseEpgTime(item, false);
        if (eMs <= windowStartMs || sMs >= windowEndMs) return;
        const visibleStart = Math.max(sMs, windowStartMs);
        const visibleEnd = Math.min(eMs, windowEndMs);
        const widthPct = Math.max(8, ((visibleEnd - visibleStart) / totalWindow) * 100);
        const isLive = (nowMs >= sMs && nowMs < eMs);
        const title = b64Decode(item.title) || "Programa";
        const tStart = new Date(sMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const tEnd = new Date(eMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        html += `<div class="epg-prog-block ${isLive ? 'current-live' : ''}" style="width: ${widthPct}%;"><div class="epg-prog-title">${title}</div><div class="epg-prog-sub">${tStart} - ${tEnd}</div></div>`;
    });
    tlBox.innerHTML = html || `<div class="epg-empty-block">Sin información en esta franja</div>`;
}

function playUrl(url) {
    const video = document.getElementById('video-player');
    if (window.Hls && Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ maxBufferLength: 20, liveSyncDurationCount: 3 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (ev, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        });
    } else {
        video.src = url;
        video.play().catch(() => {});
    }
}

function selectChannel(streamId) {
    const stream = currentStreams.find(s => s.stream_id == streamId) || favorites.find(f => f.stream_id == streamId);
    if (!stream) return;
    playingId = stream.stream_id;

    document.querySelectorAll('.epg-row').forEach(r => r.classList.remove('active-row'));
    const activeRow = document.querySelector(`.epg-row[data-stream-id="${streamId}"]`);
    if (activeRow) activeRow.classList.add('active-row');

    playUrl(`${HOST}/live/${USER}/${PASS}/${stream.stream_id}.m3u8`);
    updateTopProgramInfo(stream);
}

async function updateTopProgramInfo(stream) {
    document.getElementById('info-ch-name').innerText = stream.name;
    document.getElementById('info-prog-title').innerText = "Cargando información...";
    document.getElementById('info-prog-time').innerText = "";
    document.getElementById('info-prog-rem').innerText = "";
    document.getElementById('info-prog-desc').innerText = "";
    document.getElementById('info-prog-next').innerText = "";
    document.getElementById('info-bar-wrap').style.display = 'none';
    showOsd(stream.name, "");

    let listings = epgCache[stream.stream_id];
    if (!listings) {
        try {
            const data = await api("get_short_epg", `&stream_id=${stream.stream_id}&limit=6`);
            listings = (data && data.epg_listings) ? data.epg_listings : [];
            epgCache[stream.stream_id] = listings;
            drawTimelineBlocks(stream.stream_id, listings);
        } catch (e) { listings = []; }
    }
    if (playingId != stream.stream_id) return; // el usuario ya cambió de canal

    if (!listings || listings.length === 0) {
        document.getElementById('info-prog-title').innerText = stream.name;
        document.getElementById('info-prog-time').innerText = "Emisión en directo";
        document.getElementById('info-prog-desc').innerText = "Sin guía de programación (EPG) para este canal.";
        return;
    }
    const now = listings[0];
    const next = listings[1];
    const title = b64Decode(now.title) || stream.name;
    const desc = b64Decode(now.description) || "Emisión en directo sin descripción adicional.";
    const sMs = parseEpgTime(now, true);
    const eMs = parseEpgTime(now, false);
    const tStart = new Date(sMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const tEnd = new Date(eMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    document.getElementById('info-prog-title').innerText = title;
    document.getElementById('info-prog-time').innerText = `${tStart} - ${tEnd}`;
    document.getElementById('info-prog-desc').innerText = desc;
    showOsd(stream.name, `${title}  ·  ${tStart} - ${tEnd}`);

    const nowMs = Date.now();
    if (eMs > sMs && nowMs >= sMs) {
        const pct = Math.min(100, Math.max(0, ((nowMs - sMs) / (eMs - sMs)) * 100));
        const remMin = Math.max(0, Math.round((eMs - nowMs) / 60000));
        document.getElementById('info-bar-wrap').style.display = 'block';
        document.getElementById('info-bar-fill').style.width = `${pct}%`;
        document.getElementById('info-prog-rem').innerText = `Quedan ${remMin} min`;
    }
    if (next) {
        const nextStart = new Date(parseEpgTime(next, true)).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('info-prog-next').innerHTML = `Después (${nextStart}): <span>${b64Decode(next.title)}</span>`;
    }
}

// --- OSD en pantalla completa ---
function showOsd(ch, prog) {
    document.getElementById('osd-ch').innerText = ch;
    document.getElementById('osd-prog').innerText = prog;
    const o = document.getElementById('osd');
    o.classList.add('show');
    clearTimeout(osdTimer);
    osdTimer = setTimeout(() => o.classList.remove('show'), 4000);
}

function setVideoFull(on) {
    videoFull = on;
    document.getElementById('player-box').classList.toggle('full', on);
    if (on) {
        const s = currentStreams[rowIdx];
        if (s) showOsd(s.name, document.getElementById('info-prog-title').innerText);
    }
}

// --- Favoritos ---
function updateFavCounter() {
    const favItem = document.getElementById('group-fav-item');
    if (favItem) favItem.innerHTML = `<i class="fa-solid fa-heart" style="color:var(--fav-color); margin-right:6px;"></i> Favoritos (${favorites.length})`;
}

function toggleFavorite(streamId, ev) {
    if (ev) ev.stopPropagation();
    const stream = currentStreams.find(s => s.stream_id == streamId) || favorites.find(f => f.stream_id == streamId);
    if (!stream) return;
    const idx = favorites.findIndex(f => f.stream_id == streamId);
    if (idx > -1) favorites.splice(idx, 1); else favorites.push(stream);
    localStorage.setItem('nx_favs', JSON.stringify(favorites));
    updateFavCounter();
    const row = document.querySelector(`.epg-row[data-stream-id="${streamId}"] .ch-fav`);
    if (row) row.classList.toggle('is-fav', idx === -1);
}

function showFavorites() {
    document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
    const favItem = document.getElementById('group-fav-item');
    if (favItem) favItem.classList.add('active');
    groupIdx = 0;
    currentStreams = favorites;
    renderEpgGrid(favorites);
}

function showAllFirstCat() { const items = groupEls(); if (items.length > 1) items[1].click(); }

function toggleGroupsPanel() {
    document.getElementById('groups-panel').classList.toggle('collapsed');
    document.getElementById('btn-toggle-groups').classList.toggle('active');
}

function filterChannels() {
    const q = document.getElementById('search-input').value.toLowerCase();
    renderEpgGrid(currentStreams.filter(s => s.name.toLowerCase().includes(q)));
}

// --- Navegación con mando ---
const rowsEl = () => [...document.querySelectorAll('#epg-rows .epg-row')];
const groupEls = () => [...document.querySelectorAll('#groups-list .group-item')];
const searchEl = () => document.getElementById('search-input');

function paintFocus() {
    document.querySelectorAll('.tv-focus').forEach(e => e.classList.remove('tv-focus'));
    let el = null;
    if (zone === 'channels') el = rowsEl()[rowIdx];
    else if (zone === 'groups') el = groupEls()[groupIdx];
    else if (zone === 'search') el = searchEl();
    if (el) { el.classList.add('tv-focus'); el.scrollIntoView({ block: 'nearest' }); }
}

function clickChannel(idx) {
    rowIdx = idx;
    zone = 'channels';
    const rows = rowsEl();
    const id = rows[idx] ? rows[idx].dataset.streamId : null;
    if (id && id == playingId) setVideoFull(true);
    else if (id) selectChannel(id);
    paintFocus();
}

function zap(delta) {
    const n = rowsEl().length;
    if (!n) return;
    rowIdx = (rowIdx + delta + n) % n;
    const row = rowsEl()[rowIdx];
    selectChannel(row.dataset.streamId);
    paintFocus();
}

function openGroupsPanel() {
    const p = document.getElementById('groups-panel');
    if (p.classList.contains('collapsed')) toggleGroupsPanel();
}

// Devuelve true si la app ha gestionado el botón Atrás (lo llama el APK)
window.nxBack = function () {
    if (videoFull) { setVideoFull(false); return true; }
    if (zone === 'search') { searchEl().blur(); zone = 'groups'; paintFocus(); return true; }
    if (zone === 'channels') { openGroupsPanel(); zone = 'groups'; paintFocus(); return true; }
    return false; // en grupos → salir de la app
};

let enterTimer = null, enterLong = false;

document.addEventListener('keydown', (e) => {
    const k = e.key, code = e.keyCode;

    // Buscador activo
    if (document.activeElement === searchEl()) {
        if (k === 'ArrowDown' || k === 'Enter') { searchEl().blur(); zone = 'channels'; rowIdx = 0; paintFocus(); e.preventDefault(); }
        else if (k === 'Escape' || k === 'GoBack') { window.nxBack(); e.preventDefault(); }
        return;
    }

    // Zapping con botones de canal
    if (k === 'ChannelUp' || k === 'PageUp' || code === 166) { zap(-1); e.preventDefault(); return; }
    if (k === 'ChannelDown' || k === 'PageDown' || code === 167) { zap(1); e.preventDefault(); return; }

    // Favorito con botón Menú
    if (k === 'ContextMenu' || k === 'Menu' || code === 82) {
        const r = rowsEl()[rowIdx]; if (r) toggleFavorite(r.dataset.streamId);
        e.preventDefault(); return;
    }

    // Pantalla completa: arriba/abajo cambia de canal
    if (videoFull) {
        if (k === 'ArrowUp') { zap(-1); e.preventDefault(); }
        else if (k === 'ArrowDown') { zap(1); e.preventDefault(); }
        else if (k === 'Enter' || k === 'Escape' || k === 'Backspace' || k === 'GoBack') { setVideoFull(false); e.preventDefault(); }
        else if (k === 'ArrowLeft' || k === 'ArrowRight') { const s = currentStreams[rowIdx]; if (s) showOsd(s.name, document.getElementById('info-prog-title').innerText); e.preventDefault(); }
        return;
    }

    switch (k) {
        case 'ArrowDown':
            if (zone === 'search') { zone = 'groups'; }
            else if (zone === 'groups') groupIdx = Math.min(groupEls().length - 1, groupIdx + 1);
            else rowIdx = Math.min(rowsEl().length - 1, rowIdx + 1);
            paintFocus(); e.preventDefault(); break;
        case 'ArrowUp':
            if (zone === 'groups') {
                if (groupIdx === 0) { openGroupsPanel(); zone = 'search'; } else groupIdx--;
            } else if (zone === 'channels') rowIdx = Math.max(0, rowIdx - 1);
            paintFocus(); e.preventDefault(); break;
        case 'ArrowRight':
            if (zone === 'groups' || zone === 'search') { if (rowsEl().length) zone = 'channels'; }
            paintFocus(); e.preventDefault(); break;
        case 'ArrowLeft':
            if (zone === 'channels') { openGroupsPanel(); zone = 'groups'; }
            paintFocus(); e.preventDefault(); break;
        case 'Enter':
            e.preventDefault();
            if (e.repeat) {
                return;
            }
            enterLong = false;
            if (zone === 'channels') {
                enterTimer = setTimeout(() => {
                    enterLong = true;
                    const r = rowsEl()[rowIdx]; if (r) toggleFavorite(r.dataset.streamId);
                }, 700);
            }
            break;
        case 'Escape': case 'Backspace': case 'GoBack':
            window.nxBack(); e.preventDefault(); break;
    }
});

document.addEventListener('keyup', (e) => {
    if (e.key !== 'Enter') return;
    if (document.activeElement === searchEl()) return;
    clearTimeout(enterTimer);
    if (videoFull) return;
    if (enterLong) { enterLong = false; return; }
    if (zone === 'groups') { const g = groupEls()[groupIdx]; if (g) g.click(); }
    else if (zone === 'search') { searchEl().focus(); }
    else if (zone === 'channels') clickChannel(rowIdx);
});

// Botón Atrás del mando sin código nativo: se usa el historial del WebView
try {
    history.pushState({ nx: 1 }, '');
    window.addEventListener('popstate', () => {
        if (window.nxBack()) history.pushState({ nx: 1 }, '');
        else history.back(); // sin nada que cerrar: salir de la app
    });
} catch (e) {}

init();
</script>
